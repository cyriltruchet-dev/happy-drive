name: Build Windows VST3
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DHD_COPY_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release --target HappyDrive_VST3 HappyDrive_Standalone
      - uses: actions/upload-artifact@v4
        with:
          name: HappyDrive-Windows
          path: |
            build/HappyDrive_artefacts/Release/VST3/
            build/HappyDrive_artefacts/Release/Standalone/*.exe
